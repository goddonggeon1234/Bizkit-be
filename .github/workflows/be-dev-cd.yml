name: CD - DEV (BE)

on:
  push:
    branches: ["develop"]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: be-dev-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    env:
      APP_NAME: "BizKit-BE"
      APP_STAGE: dev
      HEALTH_URL: http://127.0.0.1:8080/actuator/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Node.js (for semantic-release)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install release deps
        run: |
          sudo apt-get update
          npm install --no-audit --no-fund

      - name: Semantic Release (dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release

      - name: Read version from gradle.properties
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials (Access Key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Java for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Spring Boot jar
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar -x test

      - name: Install Buildah
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          AWS_REGION="${{ secrets.AWS_REGION }}"
          AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          ECR_REPOSITORY="${{ secrets.ECR_REPOSITORY_BE_DEV }}"
          if [[ -z "${ECR_REPOSITORY}" ]]; then
            ECR_REPOSITORY="bizkit-be-dev"
          fi

          aws ecr get-login-password --region "${AWS_REGION}" | \
            buildah login --username AWS --password-stdin "${ECR_REGISTRY}"

          if ! aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "${ECR_REPOSITORY}" --region "${AWS_REGION}" >/dev/null
          fi

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Build and Push BE Container Image
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.value }}"
          IMAGE_TAG="dev-${VERSION}-${GITHUB_SHA::7}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          buildah bud --layers --arch arm64 -f Containerfile -t "${IMAGE_URI}" .
          buildah push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Update cloud repo manifest for ArgoCD
        shell: bash
        env:
          CLOUD_REPO_TOKEN: ${{ secrets.CLOUD_REPO_TOKEN || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CLOUD_REPO_BRANCH: main
        run: |
          set -euo pipefail
          bash scripts/update-cloud-gitops-manifests.sh "${APP_STAGE}" "${IMAGE_URI}"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="❌ BE Dev GitOps CD 실패 ❌
          Repo: \`${{ github.repository }}\`
          Branch: \`${{ github.head_ref || github.ref_name }}\`
          Workflow: \`${{ github.workflow }}\`
          Job: \`${{ github.job }}\`
          Author: \`${{ github.actor }}\`
          Stage: \`${APP_STAGE}\`
          Version: \`${{ steps.ver.outputs.value }}\`
          링크: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          JSON_MESSAGE=$(printf '%s\n' "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_MESSAGE" \
            "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MESSAGE="✅ BE Dev GitOps CD 성공 ✅
          Repo: \`${{ github.repository }}\`
          Branch: \`${{ github.head_ref || github.ref_name }}\`
          Workflow: \`${{ github.workflow }}\`
          Job: \`${{ github.job }}\`
          Author: \`${{ github.actor }}\`
          Stage: \`${APP_STAGE}\`
          Version: \`${{ steps.ver.outputs.value }}\`
          링크: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          JSON_MESSAGE=$(printf '%s\n' "$MESSAGE" | python3 -c 'import json,sys; print(json.dumps({"content": sys.stdin.read()}))')

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_MESSAGE" \
            "$DISCORD_WEBHOOK_URL"
